use_default_settings: true
server:
  # Overridden by SEARXNG_SECRET; never put a real value here.
  secret_key: ""
  limiter: false
search:
  formats:
    - html
    - json
  suspended_times:
    SearxEngineTooManyRequests: 600
outgoing:
  request_timeout: 3.0
  max_request_timeout: 8.0
engines:
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
