services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - ai

  mcp-search:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: mcp-search
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "${SEARCH_BIND_ADDRESS:-127.0.0.1}:${SEARCH_PORT:-8890}:8000"
    depends_on:
      - searxng
    networks:
      - ai

networks:
  ai:
    external: true
