services:
  searxng:
    # Official Docker Hub manifest, resolved 2026-10-18; update deliberately.
    image: searxng/searxng@sha256:8bdd9aa136b2dc3b9332cf24714fa34a375b8a1949a1201ec900c24d7378596e
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set a new local SearXNG secret before starting}
    restart: unless-stopped
    volumes:
      - ./searxng-settings.example.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai

  mcp-search:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: mcp-search
    restart: unless-stopped
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "${SEARCH_BIND_ADDRESS:-127.0.0.1}:${SEARCH_PORT:-8890}:8000"
    depends_on:
      searxng:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai

networks:
  ai:
    external: true
