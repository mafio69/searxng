required-version = "==0.17.1"
target-version = "py312"
force-exclude = true
extend-exclude = [
    ".local", "web/node_modules", "web/dist", "mcp/static", ".env*",
    "**/*secret*", "**/*token*", "**/*credential*",
]
cache-dir = ".local/cache/ruff"
fix = false

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests add the standalone application directories before importing modules.
"tests/*.py" = ["E402"]
